<body>
<!-- Do Yourself v2 · Contratação (/contratar). As telas são desenhadas por js/contratar.js -->
<a class="pular" href="#tela">Pular para o formulário</a>
<header class="tp">
  <div class="tp__in">
    <a class="tp__logo" href="/" aria-label="Do Yourself, voltar para a página inicial"><img src="/img/marca/dy-lockup-menu-claro.svg" alt="Do Yourself" width="178" height="34"></a>
    <ol class="tp__et" data-etapas aria-label="Etapas da contratação"></ol>
    <a class="tp__zap" data-zap target="_blank" rel="noopener"><img src="/img/icones/whatsapp-branco.svg" alt="" width="22" height="22"><span>Tirar dúvida</span></a>
  </div>
  <div class="tp__barra" aria-hidden="true"><i data-barra></i></div>
</header>

<main class="pg">
  <div class="col">
  <div class="tela" id="tela" data-tela tabindex="-1"><noscript><p>Para contratar pelo site, ative o JavaScript do navegador.</p></noscript></div>
<div class="rod" data-rod hidden>
  <button class="rod__res" type="button" data-abrir-resumo hidden><small>Seu pedido</small><b data-rod-v></b></button>
  <button class="bt bt--marca" type="button" data-ir></button>
</div>
  </div>
  <aside class="lado" data-lado aria-label="Seu pedido" hidden></aside>
</main>

<footer class="pe"><p>© Do Yourself</p><nav aria-label="Links legais"><a href="/privacidade" target="_blank" rel="noopener">Privacidade</a><a href="/termos" target="_blank" rel="noopener">Termos de uso</a></nav></footer>

<dialog class="jan" data-jan="resumo" aria-labelledby="jan-r"><div class="jan__in"><div class="jan__cab"><h2 id="jan-r">Seu pedido</h2><button type="button" data-fechar aria-label="Fechar">×</button></div><div data-jan-resumo></div></div></dialog>
<dialog class="jan" data-jan="remover" aria-labelledby="jan-x"><div class="jan__in"><h2 id="jan-x">Remover do pedido?</h2><p data-jan-txt></p><div class="jan__bts"><button class="bt bt--linha" type="button" data-fechar>Manter</button><button class="bt bt--verm" type="button" data-sim>Remover</button></div></div></dialog>
<dialog class="jan" data-jan="cashback" aria-labelledby="jan-c"><div class="jan__in"><div class="jan__cab"><h2 id="jan-c">Como funciona o Cashback</h2><button type="button" data-fechar aria-label="Fechar">×</button></div><div data-jan-cb></div><button class="bt bt--marca" type="button" data-fechar>Entendi</button></div></dialog>

<script src="/js/pedido.js"></script>
<script src="/js/vendor/gsap.min.js"></script>
<script src="/js/contratar.js"></script>
